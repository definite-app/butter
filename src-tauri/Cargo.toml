[package]
name = "butter"
version = "0.1.0"
description = "Arc-style sidebar for managing terminal sessions"
authors = ["you"]
edition = "2021"

[lib]
name = "butter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# "Butter Dev" build flavor: isolated data dirs (~/.butter-dev,
# ~/.config/butter-dev), no Cmd+E global shortcut, separate agent API ports.
# Enabled by tauri.dev.conf.json (build.features); see `npm run build:dev-app`.
dev-flavor = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
libc = "0.2"
block2 = "0.6"

# HTTP server for agent API
axum = "0.7"
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard", "NSPasteboardItem", "NSImage", "NSBitmapImageRep", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSData", "NSArray", "NSDictionary", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
